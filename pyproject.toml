[project]
name = "tfg-julio"
version = "0.1.0"
description = "Experimentos de reconocimiento de emociones en audio con RAVDESS, TESS y SAVEE"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "marimo>=0.13",
    "librosa>=0.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "torch>=2.2",
    "pywavelets>=1.6",
    "transformers>=4.40",
    "tqdm>=4.66",
    "soundfile>=0.12",
]

[tool.uv]
package = false